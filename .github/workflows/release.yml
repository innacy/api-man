name: Release

# Push a tag like v0.2.0 → builds installers on all 3 OSes → GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Release gate: unit, integration and e2e (real binary, headless) tests on
  # every OS we ship. No installers are built unless all of these pass.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux webview libs (window.go compiles against them)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go test -tags webkit2_41 ./...
      - run: node --test server/codegen.test.js server/postman.test.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Linux → .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          wails build -s -skipbindings -tags webkit2_41
          mkdir -p build/linux
          sed 's|@BIN@|apiperf|' deploy/apiperf.desktop > build/linux/apiperf.desktop
          go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1 pkg -p deb -t build/bin/
          mv build/bin/apiperf build/bin/apiperf-linux-amd64

      # No paid Apple account: ad-hoc signature (free, required for Apple
      # Silicon to run it at all). Users right-click → Open the first time.
      - name: macOS → .app zip (universal)
        if: runner.os == 'macOS'
        run: |
          wails build -s -skipbindings -platform darwin/universal
          APP=$(ls -d build/bin/*.app)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" build/bin/API-Man-macos-universal.zip

      - name: Windows → installer .exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis -VERSION
          wails build -s -skipbindings -nsis
          ls build/bin/*-installer.exe  # wails skips NSIS silently; fail loudly instead

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/bin/*.deb
            build/bin/apiperf-linux-amd64
            build/bin/*.zip
            build/bin/*-installer.exe
